[project]
name = "plot-stress-2d"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matheus Amancio Miranda", email = "matheus_miranda@lccv.ufal.br" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "marimo>=0.24.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
]

[project.scripts]
plot-stress-2d = "plot_stress_2d:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.vercel]
entrypoint = "src.plot_stress_2d.api:app"
